plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.kapt"
    id "androidx.navigation.safeargs.kotlin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.project.farmingapp"
    compileSdk 34

    defaultConfig {
        applicationId "com.project.farmingapp"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Roboflow API key — set ROBOFLOW_API_KEY=rf_your_key in local.properties.
        // Never hardcode the key here.
        def localProps = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) localProps.load(new FileInputStream(localFile))
        buildConfigField "String", "ROBOFLOW_API_KEY",
            "\"${localProps.getProperty("ROBOFLOW_API_KEY", "")}\""
        buildConfigField "String", "HUGGINGFACE_API_KEY",
            "\"${localProps.getProperty("HUGGINGFACE_API_KEY", "")}\""
        // FieldGuard AI — OpenAI-compatible Chat Completions (Meta Model API or local Muse Glimmer).
        // Set LLM_API_KEY in local.properties only; never commit real keys.
        def llmBase = localProps.getProperty("LLM_BASE_URL", "https://api.meta.ai/v1")
            .replace("\\", "\\\\").replace("\"", "\\\"")
        def llmModel = localProps.getProperty("LLM_MODEL", "muse-spark-1.3")
            .replace("\\", "\\\\").replace("\"", "\\\"")
        def llmKey = localProps.getProperty("LLM_API_KEY", "")
            .replace("\\", "\\\\").replace("\"", "\\\"")
        buildConfigField "String", "LLM_BASE_URL", "\"${llmBase}\""
        buildConfigField "String", "LLM_MODEL", "\"${llmModel}\""
        buildConfigField "String", "LLM_API_KEY", "\"${llmKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            // Package root-level crops images as Android assets.
            assets.srcDirs += ["../crops"]
        }
    }

    // Longer ADB timeout for slow boots / flaky emulator-ADB handshake (default is often too tight on Windows).
    adbOptions {
        timeOutInMs = 900_000
    }
}

configurations.configureEach {
    resolutionStrategy {
        // Prevent transitive Kotlin 2.1 stdlib from breaking compilation when using Kotlin 1.9.x
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
    }
}

dependencies {
    // Keep AndroidX versions compatible with compileSdk 34 (AGP 8.2.2).
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.webkit:webkit:1.11.0"

    // Retrofit + JSON
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Kotlin coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"

    // Location
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.android.gms:play-services-auth:21.4.0"
    implementation "com.google.android.gms:play-services-maps:19.0.0"

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    // DI (keep existing)
    implementation "org.kodein.di:kodein-di-generic-jvm:6.2.1"
    implementation "org.kodein.di:kodein-di-framework-android-x:6.2.1"

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // Images
    implementation "com.squareup.picasso:picasso:2.8"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    kapt "com.github.bumptech.glide:compiler:4.16.0"

    // ViewPager2 (replaces PosterSlider + ExoPlayer - incompatible API)
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    // Charts (market price graph)
    implementation "com.github.PhilJay:MPAndroidChart:3.1.0"

    // FieldGuard AI — offline alert queue retries
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // (Temporarily removed) Razorpay checkout SDK.
    // The upstream artifacts currently conflict on namespace under AGP 9+, causing resource/manifest failures.

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
